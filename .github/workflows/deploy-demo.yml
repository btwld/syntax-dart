name: Deploy demo

# Publishes the syntax_flutter example to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push waits for the running deploy instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      # Same order as CI: the example is not a workspace member, and Flutter
      # 3.35 fails root `flutter pub get` until the example has a package
      # config (flutter/flutter#175650).
      - name: Install example dependencies
        working-directory: packages/syntax_flutter/example
        run: flutter pub get

      - name: Install dependencies
        run: flutter pub get

      # Reads where Pages serves the site: /syntax-dart when it is public,
      # the root of its own subdomain when it is private. Fails if Pages is
      # not enabled with GitHub Actions as its source.
      - id: pages
        uses: actions/configure-pages@v6

      - name: Build example for web
        working-directory: packages/syntax_flutter/example
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: flutter build web --release --base-href "$BASE_PATH/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/syntax_flutter/example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
