name: syntax
description: >-
  TextMate-grammar syntax highlighting in pure Dart. Tokenizes code with VS Code
  grammars and themes and renders tokens, diffs, HTML, or ANSI. No Flutter
  required.
version: 0.0.1
repository: https://github.com/btwld/syntax-dart/tree/main/packages/syntax
homepage: https://github.com/btwld/syntax-dart
issue_tracker: https://github.com/btwld/syntax-dart/issues
topics:
  - syntax-highlighting
  - textmate
  - code
  - highlighter
environment:
  sdk: ^3.9.0
resolution: workspace
dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
