name: syntax_noir
description: >-
  Terminal widgets for syntax on noir: a code highlighter for noir's CodeView
  and a patch view with word-level changes, driven by TextMate grammars.
version: 0.0.1
repository: https://github.com/btwld/syntax-dart/tree/main/packages/syntax_noir
homepage: https://github.com/btwld/syntax-dart
issue_tracker: https://github.com/btwld/syntax-dart/issues
topics:
  - syntax-highlighting
  - tui
  - terminal
  - code
environment:
  sdk: ^3.10.0
platforms:
  linux:
  macos:
  windows:
dependencies:
  noir: ^0.0.4
  syntax: ^0.0.1
dev_dependencies:
  lints: ^6.0.0
  # Exact, while it is an alpha.
  noir_driver: 0.0.1-alpha.2
  test: ^1.26.0
