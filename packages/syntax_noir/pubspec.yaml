name: syntax_noir
description: >-
  Terminal widgets for syntax on noir: a code highlighter for noir's CodeView
  and a patch view with word-level changes, driven by TextMate grammars.
version: 0.1.0-dev
repository: https://github.com/btwld/syntax-dart/tree/main/packages/syntax_noir
issue_tracker: https://github.com/btwld/syntax-dart/issues
publish_to: none
topics:
  - syntax-highlighting
  - tui
  - terminal
  - code
environment:
  sdk: ^3.10.0
platforms:
  linux:
  macos:
  windows:
dependencies:
  noir: ^0.0.4
  syntax: ^0.1.0-dev
# Until syntax is published. This package needs Dart 3.10 for noir, so it
# is not part of the workspace, whose packages support Dart 3.9.
dependency_overrides:
  syntax:
    path: ../syntax
dev_dependencies:
  lints: ^6.0.0
  # Exact, while it is an alpha.
  noir_driver: 0.0.1-alpha.2
  test: ^1.26.0
