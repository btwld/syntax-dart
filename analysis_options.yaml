include:
  - package:bitwild_analysis/dart.yaml
  - package:bitwild_analysis/plugin.yaml

# The regex engine and grammar code follow vscode-textmate and Oniguruma,
# whose signatures pass flags positionally. Keep them comparable with upstream.
plugins:
  bitwild_lints:
    git:
      url: https://github.com/btwld/lints.git
      path: packages/bitwild_lints
      ref: v0.3.0
    # This block replaces the one in plugin.yaml, so it repeats the other
    # opt-in rules.
    diagnostics:
      avoid_barrel_imports_in_src: true
      avoid_deeply_nested_conditionals: true
      prefer_named_boolean_parameters: false
